---
# Example inventory: placeholder host names only. The real inventory lives in AWX/Ascender.
all:
  children:
    proxmox:
      hosts:
        localhost:
          ansible_connection: local

    # Host that deletes Windows VMs' AD computer objects (set ad_cleanup_host to its name). It needs the
    # ActiveDirectory PowerShell module: a domain controller, or a member server with RSAT-AD-PowerShell. The play
    # only connects to it for that task. The connection account needs WinRM access to it; the delete itself runs as
    # ad_cleanup_user (default domain_join_user). See README.md, "Active Directory cleanup".
    ad_management:
      hosts:
        mgmt-01.ad.example.com:
          ansible_connection: psrp
          ansible_psrp_protocol: https
          ansible_psrp_auth: negotiate
          ansible_psrp_cert_validation: ignore
          ansible_user: "{{ ad_management_user }}"
          ansible_password: "{{ ad_management_password }}"
