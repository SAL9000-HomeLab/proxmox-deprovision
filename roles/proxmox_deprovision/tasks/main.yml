---
# roles/proxmox_deprovision/tasks/main.yml

- name: Merge Proxmox defaults
  set_fact:
    proxmox: >-
      {{
        proxmox_defaults
        | combine(proxmox | default({}), recursive=True)
      }}

- name: Ensure vms_to_delete present
  assert:
    that:
      - vms_to_delete is defined
      - vms_to_delete | length > 0
    fail_msg: "No vms_to_delete defined. Pass vms_to_delete via AWX extra vars, inventory, host_vars, or group_vars/proxmox.yml."

- name: Deprovision VMs from list
  include_tasks: deprovision_vm.yml
  loop: "{{ vms_to_delete }}"
  loop_control:
    loop_var: vm_item
