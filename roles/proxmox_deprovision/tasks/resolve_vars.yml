---
# roles/proxmox_deprovision/tasks/resolve_vars.yml

- name: Reset per-VM facts
  set_fact:
    target_exists: false
    cluster_vm_match: []
  run_once: false

- name: Prepare safe defaults
  set_fact:
    proxmox_cb: "{{ proxmox_merged if (proxmox_merged is defined) else {} }}"
    proxmox_defaults_cb: "{{ proxmox_defaults if (proxmox_defaults is defined) else {} }}"
  run_once: false

- name: Prepare VM variables
  set_fact:
    node_name: >-
      {{ vm_item.node
         | default( proxmox_cb.get('node') | default(proxmox_defaults_cb.get('node','pve01')) ) }}
    vm_name: "{{ vm_item.name | default(vm_item.vmid | string) }}"
    vmid: >-
      {{ vm_item.vmid | default(0) | int }}
    delete_force: "{{ vm_item.force | default(true) | bool }}"
    delete_destroy_disk: "{{ vm_item.destroy_disk | default(true) | bool }}"
  run_once: false

- name: Validate VM target
  assert:
    that:
      - vmid is defined
      - (vmid | int) > 0
    fail_msg: "Each vms_to_delete item must define a positive vmid."

- name: Query cluster-wide VM resources
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/resources
      - --type
      - vm
      - --output-format
      - json
  delegate_to: "{{ node_name }}"
  become: true
  register: cluster_resources_result
  changed_when: false

- name: Locate the VM's actual node within the cluster
  set_fact:
    cluster_vm_match: >-
      {{
        (cluster_resources_result.stdout | from_json)
        | selectattr('vmid', 'defined')
        | selectattr('vmid', 'equalto', vmid | int)
        | list
      }}
  run_once: false

- name: Mark VM presence and host node when found in the cluster
  set_fact:
    target_exists: true
    node_name: "{{ cluster_vm_match[0].node }}"
  when: cluster_vm_match | length > 0

- name: Fail when target VM is absent
  fail:
    msg: "VM {{ vmid }} not found on any accessible cluster node."
  when: not target_exists | default(false)
