---
# roles/proxmox_deprovision/tasks/resolve_vars.yml

- name: Prepare safe defaults
  ansible.builtin.set_fact:
    proxmox_cb: "{{ proxmox_merged if (proxmox_merged is defined) else {} }}"
    proxmox_defaults_cb: "{{ proxmox_defaults if (proxmox_defaults is defined) else {} }}"
  run_once: false

- name: Prepare VM variables
  ansible.builtin.set_fact:
    node_name: >-
      {{ vm_item.node
         | default( proxmox_cb.get('node') | default(proxmox_defaults_cb.get('node','pve01')) ) }}
    vm_name: "{{ vm_item.name | default(vm_item.vmid | string) }}"
    vmid: >-
      {{ vm_item.vmid | default(0) | int }}
    delete_force: "{{ vm_item.force | default(true) | bool }}"
    delete_timeout: >-
      {{ proxmox_cb.get('timeout', proxmox_defaults_cb.get('timeout', 300)) | int }}
    snippets_dir: >-
      {{ proxmox_cb.get('snippets_dir', proxmox_defaults_cb.get('snippets_dir', '/var/lib/vz/snippets'))
         | regex_replace('/+$', '') }}
  run_once: false

- name: Validate VM target
  ansible.builtin.assert:
    that:
      - vmid is defined
      - (vmid | int) > 0
    fail_msg: "Each vms_to_delete item must define a positive vmid."

- name: Run qm list on node to discover existing VMs
  ansible.builtin.command:
    cmd: qm list
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_list_full
  changed_when: false

- name: Determine if target vmid exists on node
  ansible.builtin.set_fact:
    target_exists: >-
      {{ (qm_list_full.stdout_lines | select('match', '^\s*' + (vmid | string) + '\s') | list) | length > 0 }}
  run_once: false

- name: Fail when target VM is absent
  ansible.builtin.fail:
    msg: "VM {{ vmid }} not found on node {{ node_name }}."
  when: not target_exists

- name: Read VM configuration before deletion
  ansible.builtin.command:
    cmd: "qm config {{ vmid }}"
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_config
  changed_when: false

# A VM without a static ipconfig0 (DHCP, or a deploy that failed before it got an IP) has no address to clean up.
- name: Resolve the VM IPv4 address for DNS cleanup
  ansible.builtin.set_fact:
    vm_ip_address: >-
      {{ ((qm_config.stdout | regex_findall('(?m)^ipconfig0:.*?ip=([0-9.]+)(?:/[0-9]+)?')) + ['']) | first }}
  run_once: false

- name: Resolve the VM reverse lookup name for DNS cleanup
  ansible.builtin.set_fact:
    vm_reverse_name: >-
      {{ ((vm_ip_address.split('.') | reverse | join('.')) ~ '.in-addr.arpa') if vm_ip_address | length > 0 else '' }}
  run_once: false

# Windows when the VM's Proxmox OS type is a Windows one (they all start with "w": win11 for Windows Server
# 2025, win10, w2k8, ...); os_type on the entry overrides it. Only Windows VMs have an AD computer object.
- name: Work out the VM's OS and AD computer name
  ansible.builtin.set_fact:
    vm_ostype: >-
      {{ ((qm_config.stdout | regex_findall('(?m)^ostype: (\S+)')) + ['other']) | first }}
    vm_proxmox_name: >-
      {{ ((qm_config.stdout | regex_findall('(?m)^name: (\S+)')) + [vm_name]) | first }}

- name: Set the VM's OS and AD computer name
  ansible.builtin.set_fact:
    vm_is_windows: >-
      {{ (vm_item.os_type == 'windows') if vm_item.os_type is defined else (vm_ostype is match('w')) }}
    # proxmox-deploy names the computer after the VM (uppercase), unless the VM had its own hostname.
    ad_computer_name: "{{ (vm_item.ad_computer_name | default(vm_item.hostname | default(vm_proxmox_name))) | upper }}"
