---
# roles/proxmox_deprovision/defaults/main.yml

proxmox_defaults:
  node: pve01.lab.example.com
  timeout: 300
  snippets_dir: /var/lib/vz/snippets

proxmox_config: {}

netbox:
  api_url: ""
  token: ""
  ssl_verify: true

technitium_dns:
  enabled: false
  api_url: ""
  api_port: 5380
  api_token: ""
  validate_certs: true
  zone: ""

netbox_cleanup: true

# --- Active Directory ---
# Before a VM is destroyed, the guest is asked over the QEMU guest agent whether it is joined to a domain (Windows:
# Win32_ComputerSystem; Linux: realm list) and under which computer name. A joined VM, Windows or Linux, has that AD
# computer object deleted after the VM is destroyed. The delete runs on ad_cleanup_host, an inventory host with the
# ActiveDirectory PowerShell module (a domain controller, or a server with RSAT-AD-PowerShell) reached over
# WinRM/PSRP with the connection settings it has in the inventory. "" skips the AD cleanup (a joined VM's object is
# then left, with a warning).
ad_cleanup: true
ad_cleanup_host: ""

# When the guest can't be asked (VM stopped, no guest agent): look up the computer account named after the VM and
# delete it only when AD says it runs the VM's OS (Windows, or not Windows). false leaves such VMs' objects alone.
ad_cleanup_unverified: true

# Account that deletes the computer object (it needs "Delete Computer objects" on the OUs). Defaults to the
# domain-join account proxmox-deploy uses. DOMAIN\user or user@domain; a bare name gets @<domain_name>.
ad_cleanup_user: "{{ domain_join_user | default('') }}"
ad_cleanup_password: "{{ domain_join_pass | default('') }}"

# Domain controller to send the AD requests to ("" = let the ActiveDirectory module pick one).
ad_cleanup_domain_server: ""

vms_to_delete: []
